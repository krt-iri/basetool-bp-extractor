name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; the release job opts into write below.
permissions:
  contents: read

# Cancel superseded runs on a branch/PR, but never cancel a tag (release) build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: pwsh

jobs:
  check:
    name: Build & test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests
        run: .\gradlew.bat --stacktrace test

      # Assemble the app image (jlink runtime + native bundle, no WiX/MSI). Catches
      # runtime-module and packaging regressions without the slow full MSI build.
      - name: Assemble app image (packaging smoke test)
        run: .\gradlew.bat --stacktrace createDistributable

  release:
    name: Package MSI & publish release
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write       # create the GitHub release and upload the MSI asset
      id-token: write       # mint the OIDC token Sigstore signs the provenance with
      attestations: write   # store the build-provenance attestation on the repository
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The release version comes from the tag (e.g. v1.2.0 -> 1.2.0), not from
      # build.gradle.kts. APP_VERSION is read by the Gradle build.
      - name: Derive version from tag
        run: |
          $v = "${{ github.ref_name }}" -replace '^v', ''
          "APP_VERSION=$v" >> $env:GITHUB_ENV
          Write-Host "Releasing version $v"

      # Always via the script: it uses WiX 7 (installed, or bootstrapped as a local
      # dotnet tool), accepts the WiX OSMF EULA (CI only), ensures the Util/UI wixext
      # extensions, and copies the MSI to dist\.
      - name: Build MSI installer
        run: .\package-msi.ps1

      # SLSA build provenance, signed via Sigstore with a short-lived OIDC certificate:
      # it binds the MSI's digest to this repository, this workflow file and the tagged
      # commit, so anyone can prove the download came out of this build and not off
      # someone's desk (`gh attestation verify`). Runs on the file in dist\ before it is
      # published, and it attests the artifact only - nothing is uploaded.
      - name: Attest build provenance for the MSI
        uses: actions/attest@v4
        with:
          subject-path: dist/*.msi

      - name: Upload MSI as build artifact
        uses: actions/upload-artifact@v7
        with:
          name: msi-installer
          path: dist/*.msi
          if-no-files-found: error

      # Uploads the MSI to VirusTotal (free Public API - see the script header for why
      # that licence fits this repo) and renders the release-notes section linking the
      # report. Deliberately non-gating: the MSI is unsigned, so Defender's ML classifier
      # flags it as a Wacatac false positive, and failing on a detection would block every
      # release. `continue-on-error` plus the script's own exit-0 policy make the scan a
      # courtesy that can never hold up a publish.
      - name: Scan the MSI on VirusTotal
        id: virustotal
        continue-on-error: true
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          $msi = Get-ChildItem dist\*.msi | Select-Object -First 1
          .\.github\scripts\virustotal-scan.ps1 -Path $msi.FullName

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.msi
          # `body` goes first, GitHub's generated changelog is appended below it. The
          # VirusTotal part is empty when the scan was unavailable, which just leaves the
          # provenance section and the generated notes.
          body: |
            ${{ steps.virustotal.outputs.release_note }}

            ## Build provenance

            This MSI ships with a signed [build provenance attestation](https://github.com/krt-profit/basetool-sc-extractor/attestations)
            (SLSA, Sigstore) tying it to the commit and workflow that built it. Verify the
            file you downloaded with the [GitHub CLI](https://cli.github.com/):

            ```
            gh attestation verify <your-file>.msi --repo krt-profit/basetool-sc-extractor
            ```
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Tags like v1.2.0-rc1 are published as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
